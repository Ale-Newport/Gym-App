# The app has no third-party Swift, CocoaPods or Python dependencies, so the only thing that can
# go stale is the set of GitHub Actions the workflows pin by commit SHA.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
    labels: [dependencies, github-actions]
