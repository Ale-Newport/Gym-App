name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default; no job needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    name: Tooling and localisation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Compile every Python tool
        run: python -m compileall -q Tools

      - name: Every translation is complete
        run: python Tools/build_localizations.py --report

      - name: The committed string catalogue matches its sources
        run: |
          git diff --exit-code -- GymApp/Resources/Localizable.xcstrings \
            || { echo "::error::Localizable.xcstrings is stale. Run: python3 Tools/build_localizations.py"; exit 1; }

      - name: Every key the code uses is defined
        run: python Tools/check_localization_keys.py --strict

      - name: Bundled JSON is valid
        run: |
          find GymApp/Resources -name '*.json' -print0 \
            | xargs -0 -n1 python -c 'import json,sys; json.load(open(sys.argv[1], encoding="utf-8"))'

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Scan the full history
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --no-banner --exit-code 1'

  build-test:
    name: Build and unit tests
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select the newest Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - name: Pick an iPhone simulator
        id: sim
        run: |
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in data if "iOS" in k),
                       key=lambda k: [int(p) for p in k.rsplit("iOS-", 1)[1].split("-")])
          for runtime in reversed(ios):
              phones = [d for d in data[runtime] if d["name"].startswith("iPhone")]
              if phones:
                  print(phones[0]["udid"]); break
          ')"
          test -n "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$udid"

      - name: Build the app and the widget (Release, simulator)
        run: |
          set -o pipefail
          xcodebuild build -project GymApp.xcodeproj -scheme GymApp -configuration Release \
            -destination "generic/platform=iOS Simulator" -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO | tail -n 40

      - name: Run the unit tests
        run: |
          set -o pipefail
          xcodebuild test -project GymApp.xcodeproj -scheme GymApp \
            -destination "id=${{ steps.sim.outputs.udid }}" -only-testing:GymAppTests \
            -derivedDataPath build/dd -resultBundlePath build/UnitTests.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/unit-tests.log \
            | grep -E "error:|failed|passed after|Test run with|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build/unit-tests.log

      - name: Upload the test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-results
          path: build/UnitTests.xcresult
          retention-days: 7
